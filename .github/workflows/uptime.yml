name: Uptime

# Checks the live site every 15 minutes. A failed run means the site is down or broken;
# GitHub emails the failure to whoever last changed this schedule.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE: https://bc.luka-pejakovic.from.hr
    steps:
      - name: Health endpoint
        run: |
          body=$(curl -fsS --max-time 20 --retry 3 --retry-delay 10 --retry-all-errors "$SITE/health")
          echo "$body"
          echo "$body" | jq -e '.status == "ok"'
      - name: Pages in all languages
        run: |
          for path in / /en/ /de/ /it/; do
            curl -fsS --max-time 20 --retry 3 --retry-delay 10 --retry-all-errors "$SITE$path" | grep -q "Baby Calculator"
            echo "$path OK"
          done
      - name: A static file (served by nginx from disk)
        run: |
          css=$(curl -fsS --max-time 20 --retry 3 --retry-delay 10 --retry-all-errors "$SITE/" \
            | grep -o '/static/styles/main\.css?v=[0-9a-f]*' | head -1)
          test -n "$css"
          type=$(curl -fsS --max-time 20 --retry 3 --retry-delay 10 --retry-all-errors -o /dev/null -w '%{content_type}' "$SITE$css")
          echo "$css: $type"
          case "$type" in text/css*) ;; *) exit 1 ;; esac
