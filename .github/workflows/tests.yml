name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install "$(grep '^ruff==' requirements-dev.txt)"  # same version as locally
      - run: ruff check
      - run: shellcheck deploy/deploy.sh
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  unit:
    name: Python and JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -m "not ui"

  ui:
    name: Browser (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps --only-shell chromium
      - run: pytest -m ui  # behaviour, layout and the axe-core accessibility audit
        env:
          ARTIFACTS_DIR: artifacts
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: generated-files
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7

  webkit:
    # Safari's engine: a smoke test of the main flows, as many visitors use iPhones
    name: Browser (WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps webkit
      - run: pytest -m webkit
        env:
          BROWSER: webkit
          ARTIFACTS_DIR: artifacts
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: generated-files-webkit
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
