# Installed as /etc/nginx/conf.d/anonymized-log.conf (http context).
# A log format without full client IPs or query strings, used by the bc.luka-pejakovic.from.hr site:
# IPv4 keeps the first three parts (203.0.113.47 -> 203.0.113.0), IPv6 the first two groups (2001:db8:…  -> 2001:db8::).
map $remote_addr $remote_addr_anonymized {
    ~^(?<prefix>\d+\.\d+\.\d+)\.\d+$          $prefix.0;
    ~^(?<prefix>[0-9a-fA-F]*)::                $prefix::;
    ~^(?<prefix>[0-9a-fA-F]*:[0-9a-fA-F]*):    $prefix::;
    default                                    0.0.0.0;
}

# Like the "combined" format, but with the shortened address and the path without its query string
# (old share links carried birth dates and names in "?d=...&n=...").
log_format anonymized '$remote_addr_anonymized - [$time_local] "$request_method $uri $server_protocol" '
                      '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
