# Template for /etc/nginx/sites-available/bc.luka-pejakovic.from.hr (without the TLS lines Certbot manages)
server {
    server_name bc.luka-pejakovic.from.hr;

    # Shortened client IPs and no query strings (deploy/nginx-anonymized-log.conf)
    access_log /var/log/nginx/access.log anonymized;

    # Security headers. They are inherited by the locations below as long as
    # those don't use add_header themselves (expires is fine).
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip_vary on;

    # Static files straight from disk. Flask adds ?v=<content hash> to every static URL,
    # so a long cache is safe.
    location /static/ {
        alias /var/www/bc.luka-pejakovic.from.hr/baby-calculator/static/;
        expires 1y;
        access_log off;
    }

    location = /favicon.ico {
        alias /var/www/bc.luka-pejakovic.from.hr/baby-calculator/static/favicon.ico;
        expires 30d;
        access_log off;
    }

    location / {
        include proxy_params;
        proxy_pass http://unix:/run/baby-calculator/bc-calculator.sock;
    }

    # TLS: Certbot adds "listen 443 ssl", the certificate and its options here on the server.
    # When updating the live file, keep those lines.

}
server {
    if ($host = bc.luka-pejakovic.from.hr) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name bc.luka-pejakovic.from.hr;
    listen 80;
    return 404; # managed by Certbot


}
