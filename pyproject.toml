[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["bc-env", ".venv", "node_modules"]

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, bugbear, pyupgrade, simplify
select = ["E", "W", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Long literal test data reads better on one line
"tests/*" = ["E501"]
